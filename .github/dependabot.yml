version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'
      groups:
          github-actions:
              patterns:
                  - '*'
          github-actions-security:
              applies-to: security-updates
              patterns:
                  - '*'
      cooldown:
          default-days: 7
