swagger: '2.0'
host: 127.0.0.1:4011
basePath: "/"
schemes:
  - http
info:
  version: 1.0.0
  title: Jane test client
  license:
    name: MIT
paths:
  "/endpoint":
    get:
      summary: Simple endpoint
      operationId: getEndpoint
      responses:
        '200':
          description: Simple endpoint response
          schema:
            "$ref": "#/definitions/SimpleResponse"
        '401':
          description: Unauthaurized response
          schema:
            "$ref": "#/definitions/Error"
      produces:
        - application/json
  "/things":
    post:
      summary: Create a thing
      operationId: createThing
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            "$ref": "#/definitions/ThingInput"
      responses:
        '201':
          description: Thing created
          schema:
            "$ref": "#/definitions/Thing"
        '400':
          description: Invalid input
          schema:
            "$ref": "#/definitions/Error"
      produces:
        - application/json
  "/things/form":
    post:
      summary: Create a thing from form data
      operationId: createFormThing
      consumes:
        - application/x-www-form-urlencoded
      parameters:
        - name: name
          in: formData
          required: true
          type: string
        - name: kind
          in: formData
          required: true
          type: string
      responses:
        '200':
          description: Thing created
          schema:
            "$ref": "#/definitions/Thing"
      produces:
        - application/json
  "/things/{thingId}":
    get:
      summary: Get a thing
      operationId: getThing
      parameters:
        - name: thingId
          in: path
          required: true
          type: string
        - name: q
          in: query
          required: true
          type: string
        - name: page
          in: query
          required: false
          type: integer
          format: int32
      responses:
        '200':
          description: Thing found
          schema:
            "$ref": "#/definitions/Thing"
        '404':
          description: Thing not found
          schema:
            "$ref": "#/definitions/Error"
      produces:
        - application/json
    delete:
      summary: Delete a thing
      operationId: deleteThing
      parameters:
        - name: thingId
          in: path
          required: true
          type: string
      responses:
        '204':
          description: Thing deleted
        '404':
          description: Thing not found
          schema:
            "$ref": "#/definitions/Error"
      produces:
        - application/json
  "/things/{thingId}/details":
    get:
      summary: Get extended details of a thing
      operationId: getThingDetails
      parameters:
        - name: thingId
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Extended thing details
          schema:
            "$ref": "#/definitions/ThingDetails"
      produces:
        - application/json
definitions:
  SimpleResponse:
    type: object
    properties:
      foo:
        type: string
      baz:
        type: boolean
  Error:
    type: object
    properties:
      message:
        type: string
  Thing:
    type: object
    required:
      - id
      - name
      - kind
      - createdAt
      - tags
    properties:
      id:
        type: string
      name:
        type: string
      kind:
        type: string
        enum:
          - created
          - updated
          - deleted
      createdAt:
        type: string
        format: date
      tags:
        type: array
        items:
          type: string
  ThingInput:
    type: object
    required:
      - name
      - kind
    properties:
      name:
        type: string
      kind:
        type: string
        enum:
          - created
          - updated
          - deleted
  ThingDetails:
    allOf:
      - "$ref": "#/definitions/Thing"
      - type: object
        required:
          - description
        properties:
          description:
            type: string
security:
  - ApiKeyAuth: []
securityDefinitions:
  ApiKeyAuth:
    type: apiKey
    in: header
    name: X-API-Key
