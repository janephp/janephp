[project]
site_name = "🌱 Jane - OpenAPI & JSON Schema Toolkit"
site_url = "https://jane.jolicode.com/"
repo_url = "https://github.com/janephp/janephp"
copyright = 'Jane is licensed under <a href="https://github.com/janephp/janephp/blob/main/LICENSE">MIT license</a>'
edit_uri = "edit/main/docs/"
docs_dir = "docs"
exclude_docs = """
_nav.md
/overrides/
/Dockerfile
"""
extra_javascript = [
  "assets/javascripts/highlight.min.js",
]
extra_css = [
  "assets/stylesheets/highlight-github.min.css",
  "assets/stylesheets/jolicode.css",
]

[project.theme]
logo = "assets/favicon.png"
favicon = "assets/favicon.png"
language = "en"
custom_dir = "docs/overrides"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.integrate",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
scheme = "default"
primary = "white"
accent = "amber"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "amber"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "amber"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.extra]
generator = false
version.provider = "mike"

[[project.extra.social]]
icon = "fontawesome/brands/github-alt"
link = "https://github.com/janephp/janephp"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://twitter.com/jolicode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
"github-callouts" = {}
footnotes = {}
pymdownx.details = {}
pymdownx.highlight.use_pygments = false
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
toc.permalink = true

[project.plugins.search]

[project.plugins."literate-nav"]
nav_file = "_nav.md"
